[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text-analyzer"
version = "0.1.0"
description = "A text analysis CLI with word count, readability, and statistics."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }]
dependencies = ["click>=8.0.0", "rich>=13.0.0"]

[project.scripts]
textan = "text_analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/Master-626/text-analyzer"
